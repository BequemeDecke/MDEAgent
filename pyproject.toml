[project]
name = "mdagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents==0.7.13",
    "dotenv==0.9.9",
    "ipykernel==7.3.0",
    "jinja2>=3.1.6",
    "langchain-openai==1.6.1",
    "langfuse==4.15.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mdeagent*", "scripts*", "benchmark*"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pygraphviz>=2.0.2",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
]

[project.scripts]
json-to-csv = "scripts.json_to_csv:main"
fetch-models = "scripts.fetch_models:main"
benchmark = "benchmark.test_models:main"
